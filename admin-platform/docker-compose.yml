version: '3.8'

services:
  # MySQL数据库
  mysql:
    image: mysql:8.0
    container_name: admin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: RBAC1
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admin-network

  # Redis缓存
  redis:
    image: redis:7-alpine
    container_name: admin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - admin-network

  # RBAC后端服务
  rbac-server:
    build:
      context: ../RBAC
      dockerfile: Dockerfile
    container_name: rbac-server
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/RBAC1?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_DATABASE: 3
      TZ: Asia/Shanghai
    ports:
      - "8082:8081"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - admin-network

  # 网关服务
  admin-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-gateway
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_DATABASE: 3
      SA_TOKEN_REDIS_HOST: redis
      SA_TOKEN_REDIS_PORT: 6379
      SA_TOKEN_REDIS_DATABASE: 3
      TZ: Asia/Shanghai
    ports:
      - "8080:8080"
    depends_on:
      - rbac-server
    networks:
      - admin-network

  # 前端服务
  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    ports:
      - "3000:80"
    depends_on:
      - admin-gateway
    networks:
      - admin-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  admin-network:
    driver: bridge
