# 生产环境：Vue 静态资源 + /api 反代到 Spring Boot（compose 服务名 backend:8080）
server {
    listen 80;
    server_name localhost;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 支持 Vue Router 的 history 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # favicon 勿与下方通用 svg 长期缓存规则绑在一起，否则改图标后用户一年都看不到新版
    location = /favicon.svg {
        add_header Cache-Control "no-cache";
    }

    # API 请求代理到 Spring Boot 后端（context-path=/api）
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Knife4j 接口文档（iframe 内嵌，资源路径为 /doc.html、/webjars 等）
    location = /doc.html {
        proxy_pass http://backend:8080/api/doc.html;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
    }
    location /webjars/ {
        proxy_pass http://backend:8080/api/webjars/;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
    }
    location /swagger-ui/ {
        proxy_pass http://backend:8080/api/swagger-ui/;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
    }
    location /v3/api-docs {
        proxy_pass http://backend:8080/api/v3/api-docs;
        proxy_set_header Host $host;
        proxy_hide_header X-Frame-Options;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 禁用目录浏览
    autoindex off;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_vary on;
}
