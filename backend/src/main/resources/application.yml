server:
  port: 8080
  servlet:
    # 统一 API 前缀，与前端 axios baseURL `/api` 一致
    context-path: /api

# Knife4j 调试默认基址（写入 OpenAPI servers，与前端 Vite 代理一致）
app:
  security:
    cookie-secure: false
  api-docs:
    server-url: http://localhost:3000/api
  log:
    retention:
      cron: "0 30 2 * * ?"
      oper-log-days: 90
      login-log-days: 90
      api-access-log-days: 30
  job:
    log-retention-days: 30
    notice-read-retention-days: 90
    ticket-recycle-retention-days: 30
    file-recycle-retention-days: 30
    chat-message-retention-days: 180
    group-chat-message-retention-days: 180
  # CORS：开发 *；生产在 application-prod.yml 配具体域名
  cors:
    allowed-origins: "*"

spring:
  application:
    name: backend
  mvc:
    throw-exception-if-no-handler-found: true
  profiles:
    # 默认 prod（宝塔直连）；本地 IDE 加 VM 选项：-Dspring.profiles.active=dev
    active: ${SPRING_PROFILES_ACTIVE:prod}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 50
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      keep-alive: true
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1
      # Redis 密码仅在 application-prod.yml（prod 环境）；本地 dev 无密码
  # 禁用 Spring Security 默认用户（使用 Sa-Token + 自定义 SecurityConfig）
  security:
    user:
      password: disabled
  mail:
    host: ${SPRING_MAIL_HOST:smtp.qq.com}
    port: ${SPRING_MAIL_PORT:465}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
  servlet:
    multipart:
      # 平台物理上限（MB），实际上传限制由系统配置-文件存储中的 maxSizeMb 控制（保存后立即生效）
      max-file-size: 500MB
      max-request-size: 500MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: com.admin.server.modules.**.dal.dataobject

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

knife4j:
  # 4.5.0 增强 Customizer 与 springdoc 2.8+ API 不兼容；关闭增强后 doc.html 仍可用
  enable: false
  setting:
    language: zh_cn
    # 与 app.api-docs.server-url 一致，文档页「调试」默认请求前端同源 /api
    enable-host: true
    enable-host-text: http://localhost:3000/api

# Sa-Token（Redis database:1）
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  is-read-cookie: true
  is-read-header: true
  is-write-cookie: true
  is-read-body: false

# 登录防爬：图形验证码开关与按 IP 分钟限流（0 表示不限制）
file:
  storage:
    local-path: ./data/uploads
    max-size-mb: 50
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp,svg,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,json,xml,zip,rar,mp4,mp3,wav,avi,mov

auth:
  security:
    captcha-enabled: true
    captcha-per-ip-minute: 40
    login-per-ip-minute: 30
    register-per-ip-minute: 10
