# 服务器生产环境（application.yml 默认即 prod，一般无需再配启动参数）
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wuadmin?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: wuadmin
    password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root
      database: 1

# 生产环境 CORS：配置具体域名，逗号分隔（须与站点一致，勿留占位符）
app:
  security:
    cookie-secure: true
  cors:
    allowed-origins: "https://wushij.online,https://www.wushij.online,https://app.wushij.online"

# 生产环境上传目录：固定绝对路径，与 nginx 的 alias C:/wu-admin/data/uploads/ 保持一致，不受启动目录影响
file:
  storage:
    local-path: C:/wu-admin/data/uploads

# 生产环境关闭接口文档（避免暴露 API 结构；开发环境 dev 仍继承主配置的 enabled: true）
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
