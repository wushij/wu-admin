# 服务器生产环境（application.yml 默认即 prod，一般无需再配启动参数）
spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/wuadmin?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: wuadmin
    password: root
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: root
      database: 1

# 生产环境 CORS：配置具体域名，逗号分隔
app:
  cors:
    allowed-origins: "https://your-domain.com,https://admin.your-domain.com"
