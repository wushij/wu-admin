server:
  port: 8080

# 后端服务地址：本机开发默认 127.0.0.1；Docker 部署时在 compose 中覆盖为 http://admin-backend:8081
app:
  backend:
    base-url: http://127.0.0.1:8081

spring:
  application:
    name: admin-gateway
  
  # Redis配置 (统一使用database 1)
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 1
      password:
      lettuce:
        pool:
          max-active: 200
          max-idle: 20
          min-idle: 5
          max-wait: 10000ms

  # Gateway路由配置
  cloud:
    gateway:
      # 全局跨域配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600
      
      # 路由配置
      routes:
        # 认证服务路由 (RBAC后端)
        - id: admin-auth
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        
        # 系统管理服务路由 (RBAC后端)
        - id: admin-system
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/system/**
          filters:
            - StripPrefix=1

        - id: admin-files
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/files/**
          filters:
            - StripPrefix=1
        
        # Dashboard统计路由 (RBAC后端)
        - id: admin-dashboard
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/dashboard/**
          filters:
            - StripPrefix=1

        # 系统监控 (RBAC后端)
        - id: admin-monitor-api-access
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/monitor/api-access/**
          filters:
            - StripPrefix=1
        - id: admin-monitor-online
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/monitor/online/**
          filters:
            - StripPrefix=1

        # Knife4j / OpenAPI 文档（供管理端 iframe 内嵌 /api/doc.html）
        - id: admin-knife4j-doc
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/doc.html
          filters:
            - StripPrefix=1
        - id: admin-knife4j-swagger-ui
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/swagger-ui/**
          filters:
            - StripPrefix=1
        - id: admin-knife4j-api-docs
          uri: ${app.backend.base-url}
          predicates:
            # 精确 /api/v3/api-docs 与 /** 子路径均需匹配（Knife4j 主文档 JSON 在根路径）
            - Path=/api/v3/api-docs,/api/v3/api-docs/**
          filters:
            - StripPrefix=1
        - id: admin-knife4j-webjars
          uri: ${app.backend.base-url}
          predicates:
            - Path=/api/webjars/**
          filters:
            - StripPrefix=1

        # Knife4j 页面在 /api/doc.html 下仍会以站点根路径请求 /v3/api-docs、/webjars（无 /api 前缀）
        - id: admin-knife4j-api-docs-root
          uri: ${app.backend.base-url}
          predicates:
            - Path=/v3/api-docs,/v3/api-docs/**
        - id: admin-knife4j-webjars-root
          uri: ${app.backend.base-url}
          predicates:
            - Path=/webjars/**
        - id: admin-knife4j-swagger-ui-root
          uri: ${app.backend.base-url}
          predicates:
            - Path=/swagger-ui,/swagger-ui/**
        
        # RBAC管理端路由
        - id: rbac-admin
          uri: ${app.backend.base-url}
          predicates:
            - Path=/rbac/**
          filters:
            - StripPrefix=1

# Sa-Token配置
sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: -1
  is-concurrent: true
  is-share: false
  token-style: uuid
  is-log: false
  # 会话存储走 spring.data.redis（与 sa-token-redis-jackson / 后端一致）

# 日志配置
logging:
  level:
    com.admin.gateway: debug
    org.springframework.cloud.gateway: debug

# 网关对认证公开接口按 IP 限流（0 表示不限制）；与 RBAC 内限流叠加
gateway:
  security:
    rate-limit:
      login-per-minute: 25
      captcha-per-minute: 35
      register-per-minute: 8
      config-per-minute: 120
