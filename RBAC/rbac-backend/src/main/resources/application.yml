server:
  port: 8081

spring:
  application:
    name: rbac-server
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/RBAC1?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: root
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
  redis:
    host: 127.0.0.1
    port: 6379
    database: 3
  # 禁用Spring Security默认用户（使用网关统一认证）
  security:
    user:
      password: disabled
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: AUTO
      logic-delete-value: 1
      logic-not-delete-value: 0
  type-aliases-package: cn.rbac.server.modules.**.dal.dataobject

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT配置
jwt:
  secret: rbac-secret-key-2026-rbac-secret-key-2026
  expiration: 86400000 # 24小时

# 登录防爬：图形验证码开关与按 IP 分钟限流（0 表示不限制）
file:
  storage:
    local-path: ./data/uploads
    max-size-mb: 50
    allowed-extensions: jpg,jpeg,png,gif,webp,bmp,svg,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,md,json,xml,zip,rar,mp4,mp3,wav,avi,mov

auth:
  security:
    captcha-enabled: true
    captcha-per-ip-minute: 40
    login-per-ip-minute: 30
    register-per-ip-minute: 10
